repos:
    # Various general + format-specific helpers
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-symlinks
          - id: trailing-whitespace
          - id: mixed-line-ending
            args: [--fix=lf]
          - id: check-yaml
            exclude: 'mkdocs.yml'
          - id: check-toml
          - id: check-json
          - id: check-ast
          - id: debug-statements
          - id: check-merge-conflict
          - id: check-shebang-scripts-are-executable
          - id: check-added-large-files
            args: [--maxkb=10000]
    - repo: https://github.com/python-jsonschema/check-jsonschema
      rev: '0.38.0'
      hooks:
          - id: check-github-workflows
    - repo: https://github.com/astral-sh/ruff-pre-commit
      # Ruff version.
      rev: v0.16.6
      hooks:
          # Run the linter.
          - id: ruff-check
            types_or: [python, pyi, jupyter]
            args: [--fix]
          # Run the formatter.
          - id: ruff-format
            types_or: [python, pyi, jupyter]
    - repo: https://github.com/pre-commit/mirrors-mypy
      rev: 'v2.3.1'
      hooks:
          - id: mypy
    - repo: https://github.com/RobertCraigie/pyright-python
      rev: v1.1.411
      hooks:
          - id: pyright
            pass_filenames: false

    # Metadata
    - repo: https://github.com/citation-file-format/cff-converter-python
      rev: 'b6045d78aac9e02b039703b030588d54d53262ac'
      hooks:
          - id: validate-cff
    - repo: https://github.com/fsfe/reuse-tool
      rev: 'v6.2.0'
      hooks:
          - id: reuse

    - repo: local
      hooks:
          # NOTE: copy from .pre-commit-hooks.yaml, for technical reasons
          - id: somesy-sync
            name: Run somesy sync
            entry: poetry run somesy sync
            language: system
            files: '^\.somesy\.toml|pyproject\.toml$'
            pass_filenames: false

          - id: somesy-fill
            name: Update AUTHORS.md
            entry: poetry run somesy fill -t docs/_template_authors.md -o AUTHORS.md
            language: system
            files: '^\.somesy\.toml|pyproject\.toml$'
            pass_filenames: false
